<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什么</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="eyebrow">随机选菜小助手</p>
      <h1>今天吃什么</h1>
      <p class="subtitle">先帮你定菜，再把食材清单和做法步骤直接摆出来。</p>
    </section>

    <section class="card picker-card">
      <div class="result-wrap">
        <p class="label">本轮抽中</p>
        <h2 id="result" class="result">点击下面按钮开始抽菜</h2>
        <p id="resultMeta" class="result-meta">可先按分类筛选，再随机抽一道更贴近今天胃口。</p>
      </div>

      <div class="actions">
        <button id="pickBtn" class="btn primary" type="button">随机选一道</button>
        <button id="rerollBtn" class="btn ghost" type="button">再来一次</button>
        <button id="copyBtn" class="btn ghost" type="button">复制结果</button>
      </div>
    </section>

    <section class="card recipe-card">
      <div class="section-head">
        <h3>食材和做法</h3>
        <span id="recipeServings" class="badge">默认 2 人份</span>
      </div>

      <div id="recipeEmpty" class="recipe-empty">
        抽中一道菜后，这里会自动显示食材清单、步骤和小贴士。
      </div>

      <div id="recipePanel" class="recipe-panel hidden">
        <div class="recipe-top">
          <div>
            <p class="recipe-label">当前菜谱</p>
            <h3 id="recipeTitle" class="recipe-title"></h3>
          </div>
          <div id="recipeTags" class="recipe-tags"></div>
        </div>

        <div class="recipe-grid">
          <section class="recipe-block">
            <h4>食材清单</h4>
            <ul id="ingredientsList" class="recipe-list"></ul>
          </section>

          <section class="recipe-block">
            <h4>做法步骤</h4>
            <ol id="stepsList" class="steps-list"></ol>
          </section>
        </div>

        <section class="recipe-block recipe-tip-block">
          <h4>小贴士</h4>
          <p id="recipeTips" class="recipe-tips"></p>
        </section>

        <section class="recipe-block recipe-video-block">
          <h4>视频教程</h4>
          <p id="recipeVideoEmpty" class="recipe-video-empty">这道菜的视频链接还没补充，后面可以继续往里加。</p>
          <div id="recipeVideoLinks" class="recipe-video-links"></div>
        </section>
      </div>
    </section>

    <section class="grid">
      <section class="card">
        <div class="section-head">
          <h3>筛选和菜单</h3>
          <span id="count" class="badge"></span>
        </div>
        <div id="filters" class="filters"></div>
        <label class="switch-row">
          <input id="avoidRecentCheckbox" type="checkbox" checked>
          <span>避开最近 3 次抽中过的菜</span>
        </label>
        <button id="toggleMenuBtn" class="toggle-menu-btn" type="button">展开全部菜单</button>
        <div id="menuList" class="menu-list is-collapsed"></div>
      </section>

      <section class="card">
        <div class="section-head">
          <h3>最近抽中</h3>
          <button id="clearHistoryBtn" class="text-btn" type="button">清空</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
      </section>
    </section>
  </main>

  <template id="menuItemTemplate">
    <button class="menu-item" type="button"></button>
  </template>

  <template id="filterTemplate">
    <button class="filter-chip" type="button"></button>
  </template>

  <script src="./script.js"></script>
</body>
</html>
